name: Crypto Hunter LP Owner and Vault Coverage Proof
on:
  workflow_dispatch:
  pull_request:
    paths:
      - crypto-hunter/forward_observer.py
      - .github/workflows/crypto-hunter-lp-owner-stream-proof.yml
  push:
    branches: [main]
    paths:
      - crypto-hunter/forward_observer.py
      - .github/workflows/crypto-hunter-lp-owner-stream-proof.yml
permissions:
  contents: read
jobs:
  verify-real-creator-lp-stream:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Restore currently observed LP control snapshots
        uses: actions/cache/restore@v4
        with:
          path: |
            evidence/state.json
            evidence/prospective_cohort_ledger.json
            evidence/shadow_outcomes_ledger.json
            evidence/onchain_lp_control_prospective.jsonl
            evidence/onchain_risk_outcomes_ledger.jsonl
          key: crypto-proof-owner-lp-${{ github.run_id }}
          restore-keys: |
            crypto-prospective-state-
      - name: Compile embedded sensor and install websocket support
        run: |
          python3 -m py_compile crypto-hunter/forward_observer.py
          python3 -m pip install -q --disable-pip-version-check 'websockets==13.1'
          python3 crypto-hunter/forward_observer.py --liquidity-selftest
      - name: Verify creator LP subscriptions or explicitly identified zero-LP vault monitoring on mainnet
        run: python3 -u crypto-hunter/forward_observer.py --creator-lp-ws-live-proof

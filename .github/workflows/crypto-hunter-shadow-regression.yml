name: Crypto Hunter Shadow Research Regression
on:
  push:
    branches: [main]
    paths: [.github/workflows/crypto-hunter-shadow-regression.yml, crypto-hunter/forward_observer.py]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Verify quote-gap collapse is NOT an actionable early stop
        run: |
          python3 - <<'PY'
          import ast,datetime as d,types
          src=open('crypto-hunter/forward_observer.py').read()
          parsed=ast.parse(src)
          fn=next(x for x in parsed.body if isinstance(x,ast.FunctionDef)
                  and x.name=='rapid_quote_crash_watch')
          module=ast.Module(body=[fn],type_ignores=[])
          events=[]
          quotes=iter([7929,7930,7931])
          scope={'d':d,'num':float,'USDC':'fake_USDC','RAPID_QUOTE_SAMPLES':3,
                 'RAPID_QUOTE_SECONDS_BETWEEN':0,
                 'rapid_quote_available_marks_this_run':0,
                 'rapid_quote_warning_events_this_run':0,
                 'rapid_quote_first_sample_90pct_cliffs_this_run':0,
                 'time':types.SimpleNamespace(sleep=lambda _:None),
                 'jupiter_quote':lambda *args:{'ok':True,'out_amount':next(quotes)},
                 'out':events.append}
          exec(compile(module,'rapid_fixture','exec'),scope)
          sh={'entry_quote':{'observed_at':d.datetime.now(d.timezone.utc).isoformat(),
                            'immediate_roundtrip_multiple':.9436554,'token_raw':326807788423}}
          case=scope['rapid_quote_crash_watch'](sh,'FAKE_MINT','FAKE_POOL','solana_FAKE_MINT')
          assert case['sample_count']==3
          assert case['first_sample_no_advance_warning_90pct_cliff']
          assert case['observed_warning_thresholds_pct']==[20,40,60]
          assert scope['rapid_quote_first_sample_90pct_cliffs_this_run']==1
          assert scope['rapid_quote_warning_events_this_run']==3
          gaps=[e for e in events if e['kind']=='rapid_quote_no_advance_warning_gap']
          assert len(gaps)==1 and gaps[0]['not_an_executable_exit'] and gaps[0]['prior_quote_x']>.9
          warnings=[e for e in events if e['kind']=='rapid_quote_crash_warning']
          assert len(warnings)==3 and all(w['first_sample_no_advance_warning'] for w in warnings)
          assert all(e.get('orders',0)==e.get('trades',0)==0 for e in events)
          # A small ordinary decline must NOT trigger the cliff classifier.
          scope['jupiter_quote']=lambda *args:{'ok':True,'out_amount':4400000}
          case2=scope['rapid_quote_crash_watch'](sh,'SAFE','P2','solana_SAFE')
          assert not case2['first_sample_no_advance_warning_90pct_cliff']
          assert scope['rapid_quote_first_sample_90pct_cliffs_this_run']==1
          print('RAPID_QUOTE_GAP_NO_ADVANCE_WARNING_FIXTURE=PASS')
          PY
      - name: Simulated API fixtures verify blocked trade never becomes a fake fill
        run: |
          python3 - <<'PY'
          import os,sys,json,io,runpy,tempfile,datetime as d,unittest.mock as mock
          from pathlib import Path
          scanner=str(Path('crypto-hunter/forward_observer.py').resolve())
          now=d.datetime.now(d.timezone.utc)
          mint='solana_9kzmb3SLsm9CuCY4FMfdpcMVcCHrzcEqxtNbG5ySYtsr'
          pool='TestPoolSPL111111111111111111111111111111111'
          quotes={'data':[]}
          calls={'page1':0,'later_price':30,'later_liquidity':0.0215}
          def fake_urlopen(request,timeout=0):
              u=request.full_url if hasattr(request,'full_url') else request
              if 'new_pools?page=1' in u:
                  calls['page1']+=1
                  price=2 if calls['page1']==1 else calls['later_price']
                  record={'attributes':{'name':'MOCK / SOL','address':pool,'base_token_price_usd':str(price),
                      'reserve_in_usd':str(25000 if calls['page1']==1 else calls['later_liquidity']),'volume_usd':{'h1':'20000'},
                      'transactions':{'h1':{'buys':150,'sells':25,'buyers':100}},
                      'pool_created_at':(now-d.timedelta(minutes=3)).isoformat()},
                      'relationships':{'base_token':{'data':{'id':mint}},
                                       'quote_token':{'data':{'id':'solana_So11111111111111111111111111111111111111112'}}}}
                  return io.BytesIO(json.dumps({'data':[record]}).encode())
              if '/swap/v2/order?' in u:return io.BytesIO(json.dumps({'outAmount':None}).encode())
              return io.BytesIO(json.dumps(quotes).encode())
          old=(now-d.timedelta(seconds=95)).isoformat()
          prev=[1.,24000.,10000.,80,25,60]
          state={pool:{'first':(now-d.timedelta(minutes=4)).isoformat(),
                        'last_distinct_at':old,'entry':None,'exit':None,'qualified':1,'count':1,
                        'peak_net':0.,'previous_signature':prev,'token_id':mint},
                 'UnquotedStuckPosition':{'first':old,'last_distinct_at':old,
                     'entry':[(now-d.timedelta(minutes=2)).isoformat(),1.0],
                     'entry_quote':{'observed_at':now.isoformat(),'token_raw':1000},
                     'token_id':'solana_11111111111111111111111111111111',
                     'quote_missing_streak':2,'peak_net':0.,'exit':None}}
          with tempfile.TemporaryDirectory() as td:
              old_dir=os.getcwd()
              try:
                  os.chdir(td);Path('evidence').mkdir()
                  Path('evidence/state.json').write_text(json.dumps(state))
                  with mock.patch('urllib.request.urlopen',side_effect=fake_urlopen),mock.patch('time.sleep',return_value=None):
                      runpy.run_path(scanner,run_name='__main__')
                  rows=[json.loads(x) for x in Path('evidence/observations.jsonl').read_text().splitlines()]
                  saved=json.loads(Path('evidence/state.json').read_text())
                  report=json.loads(Path('evidence/summary.json').read_text())
                  assert calls['page1']==3
                  assert saved[pool]['entry'] is None,'Blocked signal must NEVER become simulated trade'
                  assert saved[pool]['shadow']['no_capital_allocated'] is True
                  assert saved[pool]['shadow']['peak_chart_multiple']>=11
                  assert len([x for x in rows if x['kind']=='shadow_research_only'])==1
                  assert len([x for x in rows if x['kind']=='shadow_chart_11x_unfilled'])==1
                  assert report['prospective_signals']==1,'Only pre-seeded independent position should count'
                  assert report['new_shadow_candidates_research_only']==1
                  assert report['shadow_chart_11x_unfilled_total']==1
                  assert report['shadow_chart_11x_first_observed_liquidity_below_usd_10000']==1
                  assert abs(saved[pool]['shadow']['first_chart_11x_liquidity_usd']-0.0215)<1e-9
                  assert report['orders']==report['trades']==0
                  print('SHADOW_RESEARCH_NO_FILL_REGRESSION=PASS',json.dumps({
                      'new_shadow':report['new_shadow_candidates_research_only'],
                      'observed_unfilled_11x':report['shadow_chart_11x_unfilled_total'],
                      'orders':report['orders'],'trades':report['trades']}))
              finally:os.chdir(old_dir)
          # Critical negative case: a new shadow must not be counted as an 11x when it never reached 11x.
          calls['page1']=0
          calls['later_price']=3
          with tempfile.TemporaryDirectory() as td:
              old_dir=os.getcwd()
              try:
                  os.chdir(td);Path('evidence').mkdir()
                  Path('evidence/state.json').write_text(json.dumps(state))
                  with mock.patch('urllib.request.urlopen',side_effect=fake_urlopen),mock.patch('time.sleep',return_value=None):
                      runpy.run_path(scanner,run_name='__main__')
                  saved=json.loads(Path('evidence/state.json').read_text())
                  receipt=json.loads(Path('evidence/summary.json').read_text())
                  assert saved[pool]['entry'] is None
                  assert saved[pool]['shadow']['peak_chart_multiple'] < 11
                  assert receipt['new_shadow_candidates_research_only']==1
                  assert receipt['shadow_chart_11x_unfilled_total']==0
                  assert receipt['shadow_chart_11x_new_this_run']==0
                  assert receipt['orders']==receipt['trades']==0
                  print('SHADOW_NO_11X_NULL_SUM_REGRESSION=PASS',json.dumps({
                      'observed_unfilled_11x':receipt['shadow_chart_11x_unfilled_total'],
                      'orders':receipt['orders'],'trades':receipt['trades']}))
              finally:os.chdir(old_dir)
          # Positive quote-at-signal research; later exact-token sell quote reaches 13x.
          # The chart does NOT reach 11x, and the hypothetical token is NEVER bought.
          import urllib.parse
          calls['page1']=0
          calls['later_price']=3
          quotes_called={'buy':0,'sell':0}
          def quotes_replay(request,timeout=0):
              u=request.full_url if hasattr(request,'full_url') else request
              if '/swap/v2/order?' in u:
                  p=urllib.parse.parse_qs(urllib.parse.urlsplit(u).query)
                  if p.get('inputMint')==['EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v']:
                      quotes_called['buy']+=1
                      return io.BytesIO(json.dumps({'outAmount':'1000','router':'MOCK'}).encode())
                  quotes_called['sell']+=1
                  amount=4900000 if quotes_called['sell']==1 else quotes_called.get('future_amount',65000000)
                  return io.BytesIO(json.dumps({'outAmount':str(amount),'router':'MOCK'}).encode())
              return fake_urlopen(request,timeout)
          with tempfile.TemporaryDirectory() as td:
              old_dir=os.getcwd()
              try:
                  os.chdir(td);Path('evidence').mkdir()
                  Path('evidence/state.json').write_text(json.dumps(state))
                  with mock.patch('urllib.request.urlopen',side_effect=quotes_replay),mock.patch('time.sleep',return_value=None):
                      runpy.run_path(scanner,run_name='__main__')
                  receipt=json.loads(Path('evidence/summary.json').read_text())
                  state_after=json.loads(Path('evidence/state.json').read_text())
                  rows=[json.loads(x) for x in Path('evidence/observations.jsonl').read_text().splitlines()]
                  assert state_after[pool]['entry'] is None
                  assert state_after[pool]['shadow']['entry_quote']['token_raw']==1000
                  assert state_after[pool]['shadow']['peak_chart_multiple']<11
                  assert state_after[pool]['shadow']['max_exit_quote_multiple']>=13
                  assert receipt['shadow_fresh_quote_slots_same_run']==1
                  assert receipt['shadow_quote_only_exit_checks_this_run']==1
                  assert state_after[pool]['shadow']['quote_available_count']==1
                  assert state_after[pool]['shadow']['initial_volume_1h_usd']==20000
                  assert state_after[pool]['shadow']['initial_buyers_1h']==100
                  assert state_after[pool]['shadow']['initial_buys_1h']==150
                  assert state_after[pool]['shadow']['initial_sells_1h']==25
                  assert state_after[pool]['shadow']['last_exit_quote_check_at']
                  assert receipt['shadow_quote_only_11x_unfilled_total']==1
                  quote_score=json.loads(Path('evidence/quote_only_shadow_outcomes.json').read_text())
                  assert quote_score['quote_ever_reached_11x_unfilled']==1
                  assert quote_score['quote_ever_reached_21x_unfilled']==0
                  assert quote_score['quote_ever_reached_51x_unfilled']==0
                  assert quote_score['quote_ever_reached_101x_unfilled']==0
                  m=state_after[pool]['shadow']['first_explosive_quote_milestones']
                  assert set(m)=={'11'} and m['11']['unfilled']
                  assert quote_score['highest_quoted_sell_multiple_unfilled']>=13
                  assert quote_score['trades']==quote_score['realized_profit_count']==0
                  assert quote_score['fees_and_execution_not_proven']
                  assert receipt['shadow_chart_11x_unfilled_total']==0
                  assert receipt['prospective_signals']==1
                  assert receipt['orders']==receipt['trades']==0
                  assert quotes_called['buy']==1 and quotes_called['sell']>=2
                  assert sum(x.get('kind')=='shadow_11x_quote_only_unfilled' for x in rows)==1
                  assert all(x.get('no_fill') and x.get('no_trade') for x in rows if x.get('kind')=='shadow_11x_quote_only_unfilled')
                  print('SHADOW_QUOTE_ONLY_13X_NO_FILL_REGRESSION=PASS',json.dumps({
                      'quote_hit_count':receipt['shadow_quote_only_11x_unfilled_total'],
                      'chart_hit_count':receipt['shadow_chart_11x_unfilled_total'],
                      'orders':receipt['orders'],'trades':receipt['trades']}))
              finally:os.chdir(old_dir)
          # Higher tier read-only future quote: +5400% in quote, NOT execution.
          calls['page1']=0
          quotes_called={'buy':0,'sell':0,'future_amount':275000000}
          with tempfile.TemporaryDirectory() as td:
              wd=os.getcwd()
              try:
                  os.chdir(td);Path('evidence').mkdir()
                  Path('evidence/state.json').write_text(json.dumps(state))
                  with mock.patch('urllib.request.urlopen',side_effect=quotes_replay),mock.patch('time.sleep',return_value=None):
                      runpy.run_path(scanner,run_name='__main__')
                  saved=json.loads(Path('evidence/state.json').read_text())
                  milestones=saved[pool]['shadow']['first_explosive_quote_milestones']
                  assert set(milestones)=={'11','21','51'} and '101' not in milestones
                  assert all(z['unfilled'] for z in milestones.values())
                  report=json.loads(Path('evidence/quote_only_shadow_outcomes.json').read_text())
                  assert report['quote_ever_reached_51x_unfilled']==1
                  assert report['quote_ever_reached_101x_unfilled']==0
                  assert report['trades']==0
                  print('THOUSANDS_PERCENT_11X_21X_51X_QUOTES_NEVER_FILLS=PASS')
              finally:os.chdir(wd)
          # A burst watcher should receive a quote in the SAME market sample.
          # Under the expanded 12-slot budget, fair rotation consumes SIX
          # older slots first; the 2-slot burst reserve must still trigger.
          burst_state=dict(state)
          for i in range(6):
              name='OldScheduledShadow%d'%i
              burst_state[name]={'first':old,'entry':None,'count':1,'qualified':0,
                  'last_distinct_at':None,'previous_signature':None,
                  'token_id':'solana_OLDSCHEDULED%d'%i,
                  'shadow':{'at':old,'entry_pool_price':1.,'peak_chart_multiple':1.,
                            'entry_quote':{'token_raw':1000},'no_capital_allocated':True}}
          burst_state[pool]={**state[pool],
              'qualified':0,'shadow':{
                  'at':old,'entry_pool_price':1.,'entry_quote':{'token_raw':1000},
                  'peak_chart_multiple':1.,'no_capital_allocated':True,
                  'last_quote_scheduled_at':now.isoformat()}}
          calls['page1']=0
          calls['later_price']=3
          calls['later_liquidity']=25000
          quotes_called={'buy':0,'sell':0}
          with tempfile.TemporaryDirectory() as td:
              wd=os.getcwd()
              try:
                  os.chdir(td);Path('evidence').mkdir()
                  Path('evidence/state.json').write_text(json.dumps(burst_state))
                  with mock.patch('urllib.request.urlopen',side_effect=quotes_replay),mock.patch('time.sleep',return_value=None):
                      runpy.run_path(scanner,run_name='__main__')
                  receipt=json.loads(Path('evidence/summary.json').read_text())
                  saved=json.loads(Path('evidence/state.json').read_text())
                  rows=[json.loads(v) for v in Path('evidence/observations.jsonl').read_text().splitlines()]
                  assert receipt['shadow_reserved_chart_burst_capacity']==2
                  assert receipt['shadow_chart_burst_quote_slots_used']==1,receipt
                  assert receipt['shadow_quote_only_exit_checks_this_run']==1
                  assert saved[pool]['shadow']['last_exit_quote_check_at']
                  assert any(v.get('lane')=='chart_burst_emergency' for v in rows)
                  assert receipt['orders']==receipt['trades']==0
                  print('CHART_ACCELERATION_PRIORITIZED_SELL_QUOTE_SAME_SAMPLE=PASS')
              finally:os.chdir(wd)
          # A full OLD 40-candidate sample should NOT permanently block fresh
          # prospectively timestamped research after capacity expands to 80.
          older=(now-d.timedelta(minutes=10)).isoformat()
          filled=dict(state)
          for i in range(40):
              filled['PreviouslyObserved%02d'%i]={
                  'first':older,'entry':None,'qualified':0,'count':1,
                  'peak_net':0.,'last_distinct_at':None,
                  'previous_signature':None,'token_id':'solana_PREV%02d'%i,
                  'shadow':{'at':older,'entry_pool_price':1.,'peak_chart_multiple':1.,
                            'no_capital_allocated':True}}
          calls['page1']=0
          quotes_called={'buy':0,'sell':0}
          with tempfile.TemporaryDirectory() as td:
              old_dir=os.getcwd()
              try:
                  os.chdir(td);Path('evidence').mkdir()
                  Path('evidence/state.json').write_text(json.dumps(filled))
                  with mock.patch('urllib.request.urlopen',side_effect=quotes_replay),mock.patch('time.sleep',return_value=None):
                      runpy.run_path(scanner,run_name='__main__')
                  receipt=json.loads(Path('evidence/summary.json').read_text())
                  saved=json.loads(Path('evidence/state.json').read_text())
                  assert receipt['shadow_live_capacity']==80
                  assert receipt['shadow_reserved_fresh_quote_capacity']==4
                  assert receipt['new_shadow_candidates_research_only']==1
                  assert receipt['shadow_active_research_only']==41
                  assert receipt['shadow_fresh_quote_slots_same_run']==1
                  assert saved[pool]['shadow']['entry_quote']['token_raw']==1000
                  assert saved[pool]['shadow']['last_exit_quote_check_at']
                  assert receipt['orders']==receipt['trades']==0
                  print('OLD_40_SHADOWS_DO_NOT_BLOCK_FRESH_80_CAPACITY=PASS')
              finally:os.chdir(old_dir)
          import ast
          # Independent predeclared retirement policy check: it must keep
          # quote winners for 24h and censor weak/unrouteable early dropouts.
          retirement_node=next(z for z in ast.parse(Path(scanner).read_text()).body
                               if isinstance(z,ast.FunctionDef) and z.name=='shadow_retirement_reason')
          retirement_mod=ast.Module(body=[retirement_node],type_ignores=[])
          ast.fix_missing_locations(retirement_mod)
          policy={'d':d,'SHADOW_RESEARCH_SECONDS':24*3600,
                  'SHADOW_NO_ENTRY_ROUTE_SECONDS':30*60,
                  'SHADOW_FLAT_QUOTE_SECONDS':90*60,
                  'SHADOW_KEEP_PEAK_QUOTE_X':1.25}
          exec(compile(retirement_mod,scanner,'exec'),policy)
          rule=policy['shadow_retirement_reason']
          def timestamp_age(seconds):
              return (now-d.timedelta(seconds=seconds)).isoformat()
          no_route=lambda seconds: {'at':timestamp_age(seconds)}
          quoted=lambda seconds,peak: {'at':timestamp_age(seconds),
                      'entry_quote':{'token_raw':1000},'max_exit_quote_multiple':peak}
          assert rule(no_route(29*60),now) is None
          assert rule(no_route(31*60),now)=='no_two_sided_entry_quote_30m'
          assert rule(quoted(89*60,.01),now) is None
          assert rule(quoted(91*60,1.24),now)=='no_promising_later_quote_90m'
          assert rule(quoted(91*60,1.25),now) is None
          assert rule(quoted(23*3600,2.0),now) is None
          assert rule(quoted(25*3600,2.0),now)=='natural_24h'
          assert rule({**no_route(2*3600),'long_tail_24h':True},now) is None
          assert rule({**quoted(3*3600,.01),'long_tail_24h':True},now) is None
          assert rule({**quoted(25*3600,100.),'long_tail_24h':True},now)=='natural_24h'
          fn=next(x for x in ast.parse(Path(scanner).read_text()).body if isinstance(x,ast.FunctionDef) and x.name=='burst_quote_eligible')
          scope={'BURST_QUOTE_RESERVE':2,'BURST_CHART_TRIGGER_X':1.8,'BURST_MIN_LIQUIDITY_USD':10000}
          exec(compile(ast.Module(body=[fn],type_ignores=[]),scanner,'exec'),scope)
          ok=scope['burst_quote_eligible']
          eligible={'entry_quote':{'token_raw':1000}}
          assert ok(eligible,1.8,10000,set(),set(),'a',0)
          assert not ok(eligible,1.799,10000,set(),set(),'a',0)
          assert not ok(eligible,11,9999,set(),set(),'a',0)
          assert not ok(eligible,11,20000,{'a'},set(),'a',0)
          assert not ok(eligible,11,20000,set(),set(),'a',2)
          assert not ok({},101,100000,set(),set(),'a',0)
          print('SHADOW_30M_90M_RETIREMENT_KEEP_WINNERS_24H=PASS')
          code=ast.parse(Path(scanner).read_text())
          tail_funcs=[x for x in code.body if isinstance(x,ast.FunctionDef)
                      and x.name in ('tail_is_selected','seed_long_tail_group')]
          namespace={'hashlib':__import__('hashlib'),'LONG_TAIL_MODULUS':5,'LONG_TAIL_MAX_ACTIVE':16}
          exec(compile(ast.Module(body=tail_funcs,type_ignores=[]),scanner,'exec'),namespace)
          draw,seed=namespace['tail_is_selected'],namespace['seed_long_tail_group']
          sample={}
          for i in range(80):
              sample['tail_%03d'%i]={'token_id':'solana_TAIL%04d'%i,
                  'shadow':{'at':timestamp_age(7200),'no_capital_allocated':True}}
          selected=seed(sample)
          assert 1<=selected<=16 and seed(sample)==0
          assert sum(z['shadow']['long_tail_24h'] for z in sample.values())==selected
          assert all(draw(z['token_id']) for z in sample.values() if z['shadow']['long_tail_24h'])
          print('DETERMINISTIC_24H_LONG_TAIL_SELECTION=PASS',selected)

          # 80/80 research slots full (not capital). Expire 20 unroutable,
          # 55 flat markets, preserve 5 promising quotes and admit a FRESH
          # signal. Check archive retains censor flags and no fabricated sale.
          aged_first=timestamp_age(2*3600)
          full_state={}
          for i in range(80):
              sh={'at':aged_first,'entry_pool_price':2.0,
                  'long_tail_24h':False,'long_tail_assignment_method':'predefined_fixture',
                  'peak_chart_multiple':1.1,'no_capital_allocated':True}
              if i>=20:
                  sh['entry_quote']={'token_raw':1000,'immediate_roundtrip_multiple':.96}
                  sh['max_exit_quote_multiple']=2.0 if i>=75 else .03
              name='FilledResearch%02d'%i
              full_state[name]={'first':aged_first,'last_distinct_at':None,
                  'entry':None,'exit':None,'count':1,'qualified':0,
                  'peak_net':0.,'previous_signature':None,
                  'token_id':'solana_'+'X'*40+('%02d'%i),
                  'shadow':sh}
          # Preserve one deliberately unquoteable legacy PAPER position,
          # otherwise this scenario should legitimately skip the shadow lane.
          # Pre-seed a qualifying historical observation so that the fresh
          # market's first replayed sample is a valid SECOND distinct signal.
          # Without this setup, the same-run fast mock (<60s) cannot qualify.
          full_state[pool]={'first':timestamp_age(240),'last_distinct_at':timestamp_age(95),
              'entry':None,'exit':None,'count':1,'qualified':1,
              'previous_signature':[1.,24000.,10000.,80,25,60],
              'token_id':mint,'peak_net':0.}
          calls['later_liquidity']=25000
          calls['later_price']=3
          full_state['UnquotedStuckPosition']={
              'first':timestamp_age(300),'last_distinct_at':timestamp_age(300),
              'entry':[timestamp_age(180),1.0],'exit':None,
              'entry_quote':{'observed_at':now.isoformat(),'token_raw':1000},
              'token_id':'solana_'+'Z'*44,'quote_missing_streak':3,
              'count':1,'qualified':0,'peak_net':0.,
              'previous_signature':None}
          calls['page1']=0
          quotes_called={'buy':0,'sell':0}
          def blocked_legacy_quote_replay(request,timeout=0):
              u=request.full_url if hasattr(request,'full_url') else request
              if '/swap/v2/order?' in u and ('inputMint='+'Z'*44) in u:
                  return io.BytesIO(b'{"outAmount":null}')
              return quotes_replay(request,timeout)
          with tempfile.TemporaryDirectory() as td:
              wd=os.getcwd()
              try:
                  os.chdir(td);Path('evidence').mkdir()
                  Path('evidence/state.json').write_text(json.dumps(full_state))
                  with mock.patch('urllib.request.urlopen',side_effect=blocked_legacy_quote_replay),mock.patch('time.sleep',return_value=None):
                      runpy.run_path(scanner,run_name='__main__')
                  result=json.loads(Path('evidence/summary.json').read_text())
                  saved=json.loads(Path('evidence/state.json').read_text())
                  archive=json.loads(Path('evidence/shadow_outcomes_ledger.json').read_text())
                  assert result['shadow_early_retirements_censored']==75,result
                  assert result['new_shadow_candidates_research_only']==1
                  assert result['shadow_active_research_only']==6
                  assert result['shadow_retirements_this_run']['no_two_sided_entry_quote_30m']==20
                  assert result['shadow_retirements_this_run']['no_promising_later_quote_90m']==55
                  assert saved[pool]['shadow']['no_capital_allocated']
                  assert saved[pool]['shadow']['entry_quote']['token_raw']==1000
                  assert len(archive)==75
                  assert all(a['shortened_24h_outcome_censored'] and not a['completed_24h']
                             and not a['evaluated_24h_trading_return'] for a in archive)
                  assert all(a['orders']==a['trades']==0 for a in archive)
                  print('FRESH_ADMISSION_AFTER_80_FULL_WITH_EARLY_CENSORING=PASS')
              finally:os.chdir(wd)
          # Starvation regression: 25 distinct quoteable shadows must get
          # one scheduling slot each within FIVE consecutive jobs, with no
          # repeated older shadow monopolizing a new job's five slots.
          import ast
          tree=ast.parse(Path(scanner).read_text())
          fn=next(x for x in tree.body if isinstance(x,ast.FunctionDef) and x.name=='fair_shadow_quote_targets')
          module=ast.Module(body=[fn],type_ignores=[])
          ast.fix_missing_locations(module)
          scope={}
          exec(compile(module,scanner,'exec'),scope)
          chooser=scope['fair_shadow_quote_targets']
          snapshot={}
          for j in range(25):
              name='ShadowPool%02d'%j
              snapshot[name]={'entry':None,'shadow':{'at':old,'entry_quote':{'token_raw':1000},
                              'no_capital_allocated':True}}
          chosen_all=[]
          for job in range(5):
              chosen=chooser(snapshot,set(),5)
              assert len(chosen)==5
              assert len(set(chosen).intersection(chosen_all))==0,'Repeated a prior job while others remain unserved'
              chosen_all.extend(chosen)
              for pool_id in chosen:
                  snapshot[pool_id]['shadow']['last_quote_scheduled_at']=(now+d.timedelta(minutes=10*job)).isoformat()
              assert chooser(snapshot,set(chosen),5)==[], 'No extra slot after full allocation'
          assert len(set(chosen_all))==25,'All 25 shadows must get scheduling opportunity'
          # An expired shadow, an unquoted token, and an existing paper entry
          # should never consume a scarce shadow quote slot.
          snapshot['Expired']={'entry':None,'shadow':{'expired':True,'entry_quote':{'token_raw':1}}}
          snapshot['Unquoted']={'entry':None,'shadow':{'at':old}}
          snapshot['PaperEntry']={'entry':[old,1],'shadow':{'at':old,'entry_quote':{'token_raw':1}}}
          assert len(chooser(snapshot,set(),5))==5
          print('SHADOW_ROUND_ROBIN_25_IN_FIVE_RUNS=PASS',json.dumps({'unique_mints_served':25,'runs':5,'orders':0,'trades':0}))
          # Larger production research sample: 40 shadows, 8 slots/run, still
          # exactly five jobs for everyone, zero fictitious sales.
          enlarged={}
          for j in range(40):
              name='ExpandedPool%02d'%j
              enlarged[name]={'entry':None,'shadow':{'at':old,'entry_quote':{'token_raw':1000},
                             'no_capital_allocated':True}}
          visits=[]
          for cycle in range(5):
              selected=chooser(enlarged,set(),8)
              assert len(selected)==8 and not set(selected).intersection(visits)
              visits.extend(selected)
              for pool_id in selected:
                  enlarged[pool_id]['shadow']['last_quote_scheduled_at']=(now+d.timedelta(minutes=12*cycle)).isoformat()
          assert len(set(visits))==40
          print('SHADOW_ROUND_ROBIN_40_IN_FIVE_RUNS=PASS',json.dumps({'quote_slots':40,'runs':5,'orders':0,'trades':0}))
          # Real source checkpoint compatibility: first run archives a legacy
          # expired quoteable shadow and an unquoted shadow; next run restores
          # and preserves the two exact same results, not duplicate wins.
          expired_at=(now-d.timedelta(hours=26)).isoformat()
          base={'first':expired_at,'entry':None,'count':1,'peak_net':0.,
                'previous_signature':None,'last_distinct_at':None,'qualified':0}
          endstate={
              'ExpiredQuoted':{**base,'token_id':'solana_'+'R'*44,'shadow':{
                  'at':expired_at,'entry_pool_price':.001,'peak_chart_multiple':19,
                  'entry_quote':{'immediate_roundtrip_multiple':.95,'token_raw':1000},
                  'quote_available_count':3,'max_exit_quote_multiple':3.3,
                  'exit_quote_missing_count':4,'no_capital_allocated':True}},
              'ExpiredNoQuote':{**base,'token_id':'solana_'+'S'*44,'shadow':{
                  'at':expired_at,'entry_pool_price':.001,'peak_chart_multiple':1.2,
                  'no_capital_allocated':True}}
          }
          with tempfile.TemporaryDirectory() as td:
              wd=os.getcwd()
              try:
                  os.chdir(td);Path('evidence').mkdir()
                  Path('evidence/state.json').write_text(json.dumps(endstate))
                  for replay in range(2):
                      with mock.patch('urllib.request.urlopen',side_effect=lambda *a,**k:io.BytesIO(b'{"data":[]}')),mock.patch('time.sleep',return_value=None):
                          runpy.run_path(scanner,run_name='__main__')
                      ledger=json.loads(Path('evidence/shadow_outcomes_ledger.json').read_text())
                      assert len(ledger)==2
                      assert len({x['pool'] for x in ledger})==2
                      good=next(x for x in ledger if x['pool']=='ExpiredQuoted')
                      assert good['max_later_sell_quote_multiple_unfilled']==3.3
                      assert good['later_sell_quotes_available']==3 and good['later_sell_quotes_failed']==4
                      assert good['initial_buy_sell_quote_available']
                      assert all(x['return_unrealized'] and x['orders']==x['trades']==0 for x in ledger)
                      assert all(not x['ever_observed_later_quote_11x'] for x in ledger)
                      assert all(x['missing_route_does_not_prove_exit'] for x in ledger)
                      study=json.loads(Path('evidence/shadow_learning_evaluation.json').read_text())
                      assert study['archived_mints']==2
                      assert study['eligible_quote_observed_after_entry']==1
                      assert study['unfilled_later_quote_2x_count']==1
                      assert study['unknown_later_quote_excluded']==0
                      assert study['precursor_medians']=={}
                      assert not study['enough_evidence_for_precursor_inference']
                      assert study['trades']==0 and study['no_filled_trades']
                  print('EXPIRED_SHADOW_ARCHIVE_PERSISTENCE_NO_FAKE_EXIT=PASS')
              finally:os.chdir(wd)
          PY

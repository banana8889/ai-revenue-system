name: Crypto Hunter Source Safety Check
on:
  push:
    branches: [main]
    paths: [.github/workflows/crypto-hunter-source-check.yml, crypto-hunter/forward_observer.py]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Static read-only safety and syntax checks
        run: |
          python3 -m py_compile crypto-hunter/forward_observer.py
          python3 crypto-hunter/forward_observer.py --native-curve-tier-selftest
          python3 - <<'PY'
          from pathlib import Path
          src=Path('crypto-hunter/forward_observer.py').read_text()
          assert "https://api.jup.ag/swap/v2/order?" in src
          assert "'inputs.chain'" not in src
          assert "entry_quote_preflight" in src
          assert "jupiter_route_preflight" in src
          assert "jupiter_sell_quote_mark" in src
          assert "legacy_chart_mark" in src
          assert "jupiter_quote(USDC,mint,5000000)" in src
          assert "private_key" not in src.lower()
          assert "/execute" not in src and "sendTransaction" not in src
          assert "orders':0" in src and "trades':0" in src
          import ast,datetime as d
          parsed=ast.parse(src)
          target=next(node for node in parsed.body if isinstance(node,ast.FunctionDef) and node.name=='paper_entry_risk_reason')
          mod=ast.fix_missing_locations(ast.Module(body=[target],type_ignores=[]))
          ns={'d':d,'st':{},'MAX_OPEN_QUOTED_POSITIONS':4,'MAX_SELL_QUOTE_AGE_SECONDS':900}
          exec(compile(mod,'paper_risk_gate','exec'),ns)
          now=d.datetime.now(d.timezone.utc)
          good={'entry_quote':{'observed_at':now.isoformat()},'entry':[now,1.],'exit':None,'quote_missing_streak':0}
          assert ns['paper_entry_risk_reason'](now) is None
          ns['st']={'a':dict(good)}
          assert ns['paper_entry_risk_reason'](now) is None
          ns['st']['a']['quote_missing_streak']=2
          assert ns['paper_entry_risk_reason'](now)=='existing_position_missing_sell_quote'
          ns['st']['a']['quote_missing_streak']=0
          ns['st']['a']['entry_quote']['observed_at']=(now-d.timedelta(minutes=17)).isoformat()
          assert ns['paper_entry_risk_reason'](now)=='existing_sell_quote_stale'
          ns['st']={str(i):dict(good) for i in range(4)}
          assert ns['paper_entry_risk_reason'](now)=='unclosed_quote_position_capacity'
          assert 'sell_marked_this_run.add(p)' in src
          assert "'quoted_positions_missing_sell_route':" in src
          print('PAPER_ENTRY_RISK_POLICY_TESTS=PASS')
          print('SOURCE_SYNTAX_AND_READ_ONLY_POLICY=PASS')
          PY
      - name: Embedded live sensor parser and pool identity checks
        run: |
          python3 -m pip install -q --disable-pip-version-check 'websockets==13.1'
          python3 crypto-hunter/forward_observer.py --liquidity-selftest

name: Crypto Hunter Vault RPC Corroboration
on:
  pull_request:
    paths:
      - crypto-hunter/forward_observer.py
      - .github/workflows/crypto-hunter-vault-rpc-corroboration.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-atomicity-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile canonical one-file observer
        run: python3 -m py_compile crypto-hunter/forward_observer.py
      - name: Install public-chain stream dependency
        run: python3 -m pip install -q --disable-pip-version-check 'websockets==13.1'
      - name: Verify stale, out-of-order and non-atomic notification guards
        run: python3 -u crypto-hunter/forward_observer.py --liquidity-selftest
      - name: Check actual mainnet sensor startup does not crash
        shell: bash
        run: |
          set -euo pipefail
          python3 -u crypto-hunter/forward_observer.py --liquidity-sensor > /tmp/crypto-live-startup.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true' EXIT
          sleep 20
          if ! kill -0 "$pid" 2>/dev/null; then
            cat /tmp/crypto-live-startup.log
            exit 1
          fi
          grep -q '"kind":"ws_started"' evidence/liquidity_ws_events.jsonl
          grep -q '"kind":"ws_slot_confirmed"' evidence/liquidity_ws_events.jsonl
          echo "MAINNET_SENSOR_SLOT_STREAM_CONFIRMED=true"
      - name: Verify actual PumpSwap mainnet RPC two-vault snapshot
        run: python3 -u crypto-hunter/forward_observer.py --pumpswap-live-proof

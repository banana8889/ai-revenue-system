name: Crypto Hunter Prospective Study
on:
  workflow_dispatch: # Preserved manually callable workflow; jobs intentionally disabled

permissions:
  contents: read
  actions: write
concurrency:
  group: crypto-hunter-prospective-study
  cancel-in-progress: false
jobs:
  observe:
    if: ${{ false }} # Retired by user's final decision, 2026-10-30
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CRYPTO_STUDY_CYCLES: '10'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Restore previous prospective state
        uses: actions/cache/restore@v4
        with:
          path: |
            evidence/state.json
            evidence/prospective_cohort_ledger.json
            evidence/shadow_outcomes_ledger.json
            evidence/onchain_lp_control_prospective.jsonl
            evidence/onchain_risk_outcomes_ledger.jsonl
          key: crypto-prospective-state-${{ github.run_id }}
          restore-keys: |
            crypto-prospective-state-
      - name: Restore dedicated first-seconds verified-mint history
        uses: actions/cache/restore@v4
        with:
          path: evidence/pumpfun_verified_mints.jsonl
          key: crypto-pumpfun-verified-mints-${{ github.run_id }}
          restore-keys: |
            crypto-pumpfun-verified-mints-
      - name: Restore native first-30s signed-event feature observations
        uses: actions/cache/restore@v4
        with:
          path: evidence/pumpfun_30s_features.jsonl
          key: crypto-pumpfun-first30-features-${{ github.run_id }}
          restore-keys: |
            crypto-pumpfun-first30-features-
      - name: Restore partial-coverage 5-to-10s first30 sensor observations
        uses: actions/cache/restore@v4
        with:
          path: evidence/pumpfun_30s_partial10_features.jsonl
          key: crypto-pumpfun-first30-partial10-${{ github.run_id }}
          restore-keys: |
            crypto-pumpfun-first30-partial10-
      - name: Restore future five-minute outcomes (only confirmed, complete cohorts)
        uses: actions/cache/restore@v4
        with:
          path: evidence/pumpfun_first30_to_5m_outcomes.jsonl
          key: crypto-pumpfun-fwd5m-${{ github.run_id }}
          restore-keys: |
            crypto-pumpfun-fwd5m-
      - name: Restore native first30 buy/sell quote evidence
        uses: actions/cache/restore@v4
        with:
          path: evidence/pumpfun_native_first30_route_quotes.jsonl
          key: crypto-pumpfun-first30-native-quotes-${{ github.run_id }}
          restore-keys: |
            crypto-pumpfun-first30-native-quotes-
      - name: Snapshot expanded cache before legacy recovery
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/crypto_new_cache"
          for file in state.json prospective_cohort_ledger.json shadow_outcomes_ledger.json onchain_lp_control_prospective.jsonl onchain_risk_outcomes_ledger.jsonl; do
            if [ -s "evidence/$file" ]; then
              cp "evidence/$file" "$RUNNER_TEMP/crypto_new_cache/$file"
            fi
          done
      - name: Recover legacy four-path checkpoint from before cache-layout change
        uses: actions/cache/restore@v4
        with:
          # IMPORTANT: exactly the OLD four paths; changing this list changes
          # cache version and makes the healthy >26K checkpoint invisible.
          path: |
            evidence/state.json
            evidence/prospective_cohort_ledger.json
            evidence/shadow_outcomes_ledger.json
            evidence/onchain_lp_control_prospective.jsonl
          key: crypto-prospective-legacy-restore-${{ github.run_id }}
          restore-keys: |
            crypto-prospective-state-
      - name: Reconcile both cache generations without losing historical signals
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os,pathlib
          root=pathlib.Path('evidence')
          root.mkdir(exist_ok=True)
          new=pathlib.Path(os.environ['RUNNER_TEMP'])/'crypto_new_cache'
          def load(path,kind):
              if not path.exists() or not path.stat().st_size:
                  return {} if kind=='dict' else []
              try:
                  with path.open(encoding='utf-8') as handle:
                      obj=json.load(handle)
              except (ValueError,UnicodeError):
                  raise SystemExit('CHECKPOINT_RECONCILIATION_INVALID='+str(path))
              if not isinstance(obj,dict if kind=='dict' else list):
                  raise SystemExit('CHECKPOINT_RECONCILIATION_WRONG_TYPE='+str(path))
              return obj
          old_state=load(root/'state.json','dict')
          fresh_state=load(new/'state.json','dict')
          state=dict(old_state)
          for pool,record in fresh_state.items():
              if pool in state and isinstance(state[pool],dict) and isinstance(record,dict):
                  state[pool]={**state[pool],**record}
              else:
                  state[pool]=record
          if state:
              (root/'state.json').write_text(json.dumps(state,separators=(',',':')),encoding='utf-8')
          for filename in ('prospective_cohort_ledger.json','shadow_outcomes_ledger.json'):
              older=load(root/filename,'list')
              newer=load(new/filename,'list')
              seen=set()
              out=[]
              for row in older+newer:
                  # The canonical writer archives each completed cohort ONCE
                  # per pool. Do not double-count differing versions of a
                  # single pool across cache generations.
                  key=(str(row.get('pool')) if isinstance(row,dict) and row.get('pool')
                       else json.dumps(row,sort_keys=True,separators=(',',':'),allow_nan=False))
                  if key not in seen:
                      out.append(row);seen.add(key)
              if out:
                  (root/filename).write_text(json.dumps(out[-1000:],separators=(',',':')),encoding='utf-8')
          filename='onchain_lp_control_prospective.jsonl'
          found={}
          for path in (root/filename,new/filename):
              if not path.exists():
                  continue
              for line in path.read_text(encoding='utf-8').splitlines():
                  try:
                      row=json.loads(line)
                  except (ValueError,TypeError):
                      continue
                  pool=row.get('pool')
                  if not isinstance(pool,str) or not row.get('available'):
                      continue
                  previous=found.get(pool)
                  if previous is None or row.get('sample_completed_at','')<previous.get('sample_completed_at',''):
                      found[pool]=row
          if found:
              with (root/filename).open('w',encoding='utf-8') as handle:
                  for row in sorted(found.values(),key=lambda x:x.get('sample_completed_at','')):
                      handle.write(json.dumps(row,allow_nan=False,separators=(',',':'))+'\n')
          filename='onchain_risk_outcomes_ledger.jsonl'
          if (new/filename).is_file():
              (root/filename).write_bytes((new/filename).read_bytes())
          # Fail closed instead of allowing a smaller fresh checkpoint to
          # displace an available older checkpoint silently.
          if len(state)<max(len(old_state),len(fresh_state)):
              raise SystemExit('STATE_RECONCILIATION_LOST_POOL_RECORDS')
          print('CRYPTO_STATE_RECONCILIATION',json.dumps({
              'legacy_tracked':len(old_state),'expanded_tracked':len(fresh_state),
              'recovered_tracked':len(state),'retained_first_lp_snapshots':len(found),
              'lossless_pool_count':len(state)>=max(len(old_state),len(fresh_state)),
              'no_trades':True},allow_nan=False))
          PY
      - name: Collect live forward-only observations without transactions
        run: |
          mkdir -p evidence
          python3 -m py_compile crypto-hunter/forward_observer.py
          if python3 -m pip install -q --disable-pip-version-check 'websockets==13.1'; then
            python3 -u crypto-hunter/forward_observer.py --liquidity-selftest
            python3 -u crypto-hunter/forward_observer.py --liquidity-sensor &
            liquidity_ws_pid=$!
            # Genuine confirmed Pump.fun create instructions, BEFORE a DEX
            # new-pool index lists the token. No wallet, orders, or fills.
            python3 -u crypto-hunter/forward_observer.py --pumpfun-early-sensor &
            early_launch_pid=$!
            trap 'kill "$liquidity_ws_pid" "$early_launch_pid" 2>/dev/null || true; wait "$liquidity_ws_pid" "$early_launch_pid" 2>/dev/null || true' EXIT
            echo "LIQUIDITY_WS_PROCESS_STARTED=$liquidity_ws_pid"
            echo "PUMPFUN_EARLY_MAINNET_PROCESS_STARTED=$early_launch_pid"
          else
            echo "LIQUIDITY_WS_UNAVAILABLE=DEPENDENCY_INSTALL_FAILED"
          fi
          python3 crypto-hunter/forward_observer.py
          python3 - <<'PY'
          import json,pathlib
          path=pathlib.Path('evidence/pumpfun_verified_mints.jsonl')
          rows=[]
          if path.is_file():
              with path.open(encoding='utf-8') as f:
                  for line in f:
                      try:
                          z=json.loads(line)
                          if z.get('kind')=='pumpfun_early_verified' and z.get('mint'):
                              rows.append(z)
                      except ValueError:
                          continue
          mints={r['mint'] for r in rows}
          thirty=pathlib.Path('evidence/pumpfun_30s_features.jsonl')
          feature_rows=[]
          if thirty.is_file():
              for line in thirty.read_text(encoding='utf-8').splitlines():
                  try:
                      row=json.loads(line)
                      if row.get('full_first_30s_observation') is True:
                          feature_rows.append(row)
                  except ValueError:continue
          print('PUMPFUN_FIRST_SECONDS_RESEARCH',json.dumps({
              'first30_completed_distinct_mints':len({
                  row['mint'] for row in feature_rows if row.get('mint')}),
              'first30_distinct_mints_with_trades':len({
                  row['mint'] for row in feature_rows
                  if row.get('mint') and row.get('observed_trades',0)>0}),
              'chain_verified_mints_retained':len(mints),
              'within_30s_receipts':sum(r.get('detected_within_first_30s')
                                         is True for r in rows),
              'read_only':True,'trades':0,
              'not_a_model_profit_or_fill':True},allow_nan=False))
          PY
          if [ -z "${liquidity_ws_pid:-}" ] || ! kill -0 "$liquidity_ws_pid" 2>/dev/null; then
            echo "FAIL: live mainnet liquidity websocket process exited"
            exit 1
          fi
          python3 - <<'PY'
          import datetime as dt,json,pathlib,sys
          f=pathlib.Path('evidence/liquidity_ws_health.json')
          if not f.is_file():
              raise SystemExit('FAIL: missing live liquidity websocket heartbeat')
          h=json.loads(f.read_text(encoding='utf-8'))
          at=dt.datetime.fromisoformat(h['at'])
          age=(dt.datetime.now(dt.timezone.utc)-at).total_seconds()
          receipt={'heartbeat_age_seconds':round(age,1),
                   'connected':h.get('connected'),
                   'max_subscriptions':h.get('max_subscriptions'),
                   'events':h.get('events'),
                   'checks':h.get('checks'),
                   'vault_ws_subscriptions':h.get('max_vault_ws_subscriptions'),
                   'rpc_checks':h.get('vault_rpc_confirmation_checks'),
                   'mainnet_slot_notifications':h.get('slot_notifications'),
                   'slot_subscriptions_confirmed':h.get('slot_subscriptions_confirmed'),
                   'trades':h.get('trades')}
          print('MAINNET_LIQUIDITY_SENSOR_HEALTH',json.dumps(receipt,allow_nan=False))
          if not (0<=age<=130 and h.get('connected') is True
                  and int(h.get('max_subscriptions') or 0)>0
                  and int(h.get('slot_notifications') or 0)>0
                  and int(h.get('slot_subscriptions_confirmed') or 0)>0
                  and h.get('orders')==h.get('trades')==0):
              raise SystemExit('FAIL: real mainnet liquidity sensor not proven live')
          PY
          python3 - <<'PY'
          import json,os,sys
          state='evidence/state.json'
          summary='evidence/summary.json'
          logs='evidence/observations.jsonl'
          if not all(os.path.isfile(p) and os.path.getsize(p)>0 for p in (state,summary,logs)):
              print('FAIL: missing state, summary or observations');sys.exit(1)
          with open(logs,encoding='utf-8') as f:rows=[json.loads(s) for s in f]
          samples=[r for r in rows if r.get('kind')=='sample' and r.get('pool_count',0)>0]
          pools=[r for r in rows if r.get('kind')=='pool']
          errors=[r for r in rows if r.get('kind')=='source_error']
          with open(summary,encoding='utf-8') as f:receipt=json.load(f)
          requested=int(os.getenv('CRYPTO_STUDY_CYCLES','3'))
          # Allow isolated endpoint failures, but require real 10-cycle coverage
          # rather than silently reporting that the longer scan ran.
          if len(samples)<max(2,requested-2):
              print('FAIL: extended collection coverage too low',{'sampled':len(samples),'requested':requested});sys.exit(1)
          if not samples or not pools or len(errors)>len(samples):
              print('FAIL: no usable live samples',{'samples':len(samples),'pools':len(pools),'errors':len(errors)});sys.exit(1)
          assert receipt.get('orders')==receipt.get('trades')==0
          with open('evidence/prospective_cohort_comparison.json',encoding='utf-8') as f:cohorts=json.load(f)
          assert cohorts['orders']==cohorts['trades']==0
          assert len(cohorts['groups'])==2
          with open('evidence/prospective_cohort_ledger.json',encoding='utf-8') as f:history=json.load(f)
          assert isinstance(history,list) and all(x['trades']==0 for x in history)
          with open('evidence/shadow_outcomes_ledger.json',encoding='utf-8') as f:shadow_history=json.load(f)
          assert isinstance(shadow_history,list) and all(x['orders']==x['trades']==0 and x['return_unrealized'] for x in shadow_history)
          with open(state,encoding='utf-8') as f:checkpoint=json.load(f)
          print('LIVE_STUDY_HEARTBEAT',json.dumps({'at':receipt['at'],'samples':len(samples),'pools':len(pools),'tracked':len(checkpoint),'signals':receipt.get('prospective_signals',0),'exits':receipt.get('paper_exits',0),'trades':0,'errors':len(errors)}))
          PY
      - name: Verify early-sensor SIGTERM persisted complete quote-censor audit
        shell: bash
        run: |
          python3 - <<'PY'
          import collections,json,pathlib
          evidence=pathlib.Path('evidence/pumpfun_first_seconds_live.jsonl')
          if not evidence.is_file():
              raise SystemExit('FAIL: missing Pump.fun live sensor shutdown evidence')
          receipts=[]
          for line in evidence.read_text(encoding='utf-8').splitlines():
              try: row=json.loads(line)
              except (ValueError,TypeError): continue
              if row.get('kind')=='pumpfun_early_sensor_shutdown_receipt':
                  receipts.append(row)
          if not receipts:
              raise SystemExit('FAIL: Pump.fun sensor stopped without final audit')
          receipt=receipts[-1]
          classes=receipt.get('five_minute_outcome_classes') or {}
          n=sum(classes.values())
          if (receipt.get('all_early_valid_quotes_classified') is not True
                  or n!=receipt.get('early_buy_quote_audited')
                  or receipt.get('orders')!=0 or receipt.get('trades')!=0):
              raise SystemExit('FAIL: Pump.fun end-of-run cohort not fully censored')
          print('PUMPFUN_GRACEFUL_RESEARCH_SHUTDOWN',json.dumps({
              'sigterm_received':receipt.get('graceful_sigterm_received'),
              'early_buy_quote_audited':n,
              'five_minute_classes':classes,
              'no_inferred_losses_for_missing_sell_routes':True,
              'no_live_trades':True},allow_nan=False))
          PY
      - name: Evaluate frozen sensor-only first30 cohorts from this exact Mainnet run
        shell: bash
        run: |
          set -euo pipefail
          python3 crypto-hunter/forward_observer.py --sensor-only-backtest
          python3 - <<'PY'
          import collections,json,pathlib
          root=pathlib.Path('evidence')
          result=json.loads((root/'sensor_only_backtest.json').read_text(encoding='utf-8'))
          assert result['features_frozen_before_later_price'] is True
          assert result['no_chart_peaks_used_for_selection'] is True
          assert result['strict_5m_gate_requires_response_timestamp_in_300_to_330s'] is True
          assert result['orders']==result['trades']==0
          live_rows=[json.loads(line) for line in
              (root/'pumpfun_first_seconds_live.jsonl').read_text(
                  encoding='utf-8').splitlines()]
          shutdown=[row for row in live_rows
                    if row.get('kind')=='pumpfun_early_sensor_shutdown_receipt']
          assert len(shutdown)==1
          session=shutdown[0].get('sensor_session_id')
          assert isinstance(session,str) and session
          rows=[json.loads(line) for line in
              (root/'pumpfun_native_first30_route_quotes.jsonl').read_text(
                  encoding='utf-8').splitlines()
              if line.strip()]
          current=[row for row in rows if row.get('sensor_session_id')==session]
          assert current and all(row.get('orders')==row.get('trades')==0
                                 for row in current)
          selection={row['mint']:row for row in current
                     if row.get('kind')=='native_first30_quote_selection'}
          audits={row['mint']:row for row in current
                  if row.get('kind')=='native_first30_five_minute_censor_audit'}
          exits={row['mint']:row for row in current
                 if row.get('kind')=='native_first30_five_minute_sell_quote'}
          assert len(selection)>0 and len(audits)>0
          assert len(selection)==sum(row.get('kind')=='native_first30_quote_selection'
                                     for row in current)
          assert len(audits)==sum(row.get('kind')=='native_first30_five_minute_censor_audit'
                                  for row in current)
          assert set(audits)<=set(selection)
          assert len(audits)==shutdown[0]['early_buy_quote_audited']
          assert all(row.get('eligible_early_buy_quote') is True
                     and row.get('missing_is_not_filled_loss') is True
                     and row.get('orders')==row.get('trades')==0
                     for row in audits.values())
          categories=collections.Counter(row['outcome_category']
                                        for row in audits.values())
          assert dict(categories)==shutdown[0]['five_minute_outcome_classes']
          lane_report={}
          for lane in ('strict_flow','loose_flow','control'):
              mints=[mint for mint,row in selection.items()
                     if row.get('selection_lane')==lane]
              valid=[mint for mint in mints if mint in audits
                     and audits[mint]['outcome_category']=='timely_quote_available']
              gross=[]
              for mint in valid:
                  q=exits.get(mint)
                  assert q and q['within_30s_of_5m_deadline'] is True
                  assert q['sell_route_available'] is True
                  val=q.get('future_quote_multiple_x')
                  assert isinstance(val,(int,float)) and val>0
                  gross.append(val)
              lane_report[lane]={
                  'signals_selected_before_future_quotes':len(mints),
                  'verified_early_entry_quotes':sum(mint in audits for mint in mints),
                  'timely_sell_quotes_available':len(valid),
                  'timely_exit_quotes_above_2pct_buffer':sum(x>1.02 for x in gross),
                  'average_quoted_exit_multiple_of_5usd':(
                      round(sum(gross)/len(gross),6) if gross else None),
                  'missing_quote_is_not_a_filled_loss':True}
          assert sum(v['signals_selected_before_future_quotes']
                     for v in lane_report.values())==len(selection)
          audit={'mainnet_run_id':'${{ github.run_id }}',
                 'scan_repo_commit':'${{ github.sha }}',
                 'sensor_session_id':session,
                 'current_run_quote_selections':len(selection),
                 'current_run_quote_audits':len(audits),
                 'current_run_outcome_class_counts':dict(categories),
                 'live_sensor_lane_quote_economics':lane_report,
                 'holdout_decision':result['holdout_decision']['decision'],
                 'holdout_strict':result['holdout_decision']['arms']['strict_flow'],
                 'response_timestamps_required':True,
                 'not_filled_profit':True,'trades':0}
          (root/'sensor_only_live_receipt.json').write_text(
              json.dumps(audit,indent=2,allow_nan=False),encoding='utf-8')
          print('SENSOR_ONLY_SAME_RUN_PROOF',json.dumps(audit,allow_nan=False))
          PY
      - name: Validate checkpoint including after collector failure
        if: always()
        id: state_integrity
        shell: bash
        run: |
          python3 - <<'PY'
          import json,pathlib,sys
          f=pathlib.Path('evidence/state.json')
          if not f.is_file():
              print('CHECKPOINT_INTEGRITY=NO_STATE')
              sys.exit(1)
          data=json.loads(f.read_text())
          assert isinstance(data,dict)
          for key,item in data.items():
              assert isinstance(key,str) and isinstance(item,dict)
              if item.get('entry'):
                  assert isinstance(item['entry'][0],str)
              if item.get('shadow'):
                  assert item['shadow'].get('no_capital_allocated') is True
          print('CHECKPOINT_INTEGRITY=PASS',json.dumps({'tracked':len(data),'paper_trades_executed':0}))
          PY
          echo "usable=true" >> "$GITHUB_OUTPUT"
      - name: Save durable state between future runs (also after receipt failure)
        if: always() && steps.state_integrity.outputs.usable == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            evidence/state.json
            evidence/prospective_cohort_ledger.json
            evidence/shadow_outcomes_ledger.json
            evidence/onchain_lp_control_prospective.jsonl
            evidence/onchain_risk_outcomes_ledger.jsonl
          key: crypto-prospective-state-${{ github.run_id }}
      - name: Persist true post-30s five-minute bonding-curve outcomes
        if: always()
        uses: actions/cache/save@v4
        with:
          path: evidence/pumpfun_first30_to_5m_outcomes.jsonl
          key: crypto-pumpfun-fwd5m-${{ github.run_id }}
      - name: Save real first-30s Pump.fun trade-flow features
        if: always()
        uses: actions/cache/save@v4
        with:
          path: evidence/pumpfun_30s_features.jsonl
          key: crypto-pumpfun-first30-features-${{ github.run_id }}
      - name: Preserve partial-coverage 5-to-10s sensor features between cycles
        if: always()
        uses: actions/cache/save@v4
        with:
          path: evidence/pumpfun_30s_partial10_features.jsonl
          key: crypto-pumpfun-first30-partial10-${{ github.run_id }}
      - name: Save native first30 exact-token quote and five-minute route history
        if: always()
        uses: actions/cache/save@v4
        with:
          path: evidence/pumpfun_native_first30_route_quotes.jsonl
          key: crypto-pumpfun-first30-native-quotes-${{ github.run_id }}
      - name: Save independent verified first-seconds mint history
        if: always()
        uses: actions/cache/save@v4
        with:
          path: evidence/pumpfun_verified_mints.jsonl
          key: crypto-pumpfun-verified-mints-${{ github.run_id }}
      - name: Preserve independent evidence and receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-prospective-evidence-${{ github.run_id }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
      - name: Maintain research loop without relying on GitHub cron
        if: success() && ((github.event_name == 'workflow_dispatch' && inputs.chain) || github.event_name == 'schedule')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # Mostly continuous research: 10 requested live samples per run,
          # followed by 15s handoff; bounded by a 30-minute job.
          # Runs remain research-only. No private keys, orders, or signatures.
          sleep 15
          # A stale older run can be reported as in_progress after it has
          # already finished, which previously killed the chain forever.
          # A newer dispatch is a valid successor; an older one is not.
          active=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/crypto-hunter-prospective-study.yml/runs?event=workflow_dispatch&per_page=20" --jq '.workflow_runs[] | "\(.id) \(.status)"' | awk -v own="${GITHUB_RUN_ID}" '$1>own && ($2=="in_progress" || $2=="queued" || $2=="pending"){print; exit}')
          if [ -n "$active" ]; then
            echo "CHANGED_RUNNING_WORKFLOW_DETECTED=$active"
            echo "Skipping duplicate chain dispatch"
            exit 0
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/crypto-hunter-prospective-study.yml/dispatches" -f ref=main -f 'inputs[chain]=true'
          echo "CHAIN_NEXT_REQUEST_ACCEPTED=true"
      - name: Bounded recovery after failed study (zero trading)
        if: failure() && github.event_name == 'workflow_dispatch' && inputs.chain
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          url="repos/${GITHUB_REPOSITORY}/actions/workflows/crypto-hunter-prospective-study.yml/runs?event=workflow_dispatch&per_page=12"
          prior=$(gh api "$url" --jq '[.workflow_runs[] | select(.status=="completed")][0:4] | .[].conclusion')
          consecutive=1
          while IFS= read -r result; do
            case "$result" in
              success) break ;;
              failure|cancelled|timed_out|action_required) consecutive=$((consecutive+1)) ;;
              *) break ;;
            esac
          done <<< "$prior"
          echo "FAILURE_CHAIN_LENGTH_INCLUDING_CURRENT=$consecutive"
          if [ "$consecutive" -ge 3 ]; then
            echo "HALTED_AFTER_THREE_CONSECUTIVE_FAILURES"
            exit 0
          fi
          sleep 70
          active=$(gh api "$url" --jq '[.workflow_runs[] | select(.status=="in_progress" or .status=="queued" or .status=="pending")] | .[].id' | grep -v "^${GITHUB_RUN_ID}$" || true)
          if [ -n "$active" ]; then
            echo "RECOVERY_SKIPPED_ALREADY_RUNNING=$active"
            exit 0
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/crypto-hunter-prospective-study.yml/dispatches" -f ref=main -f 'inputs[chain]=true'
          echo "FAILED_RUN_RECOVERY_DISPATCH_ACCEPTED=true"

name: Crypto Hunter Prospective Study
on:
  workflow_dispatch:
    inputs:
      chain:
        description: "Opt in to unattended self-dispatch research cycles"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '3,33 * * * *'
  push:
    branches: [main]
    paths:
      - .github/workflows/crypto-hunter-prospective-study.yml
      - crypto-hunter/liquidity_ws_sensor.py
permissions:
  contents: read
  actions: write
concurrency:
  group: crypto-hunter-prospective-study
  cancel-in-progress: false
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CRYPTO_STUDY_CYCLES: '12'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Restore previous prospective state
        uses: actions/cache/restore@v4
        with:
          path: |
            evidence/state.json
            evidence/prospective_cohort_ledger.json
            evidence/shadow_outcomes_ledger.json
          key: crypto-prospective-state-${{ github.run_id }}
          restore-keys: |
            crypto-prospective-state-
      - name: Collect live forward-only observations without transactions
        run: |
          mkdir -p evidence
          python3 -m py_compile crypto-hunter/forward_observer.py
          python3 -m py_compile crypto-hunter/liquidity_ws_sensor.py
          if python3 -m pip install -q --disable-pip-version-check 'websockets==13.1'; then
            python3 -u crypto-hunter/liquidity_ws_sensor.py &
            liquidity_ws_pid=$!
            trap 'kill "$liquidity_ws_pid" 2>/dev/null || true; wait "$liquidity_ws_pid" 2>/dev/null || true' EXIT
            echo "LIQUIDITY_WS_PROCESS_STARTED=$liquidity_ws_pid"
          else
            echo "LIQUIDITY_WS_UNAVAILABLE=DEPENDENCY_INSTALL_FAILED"
          fi
          python3 crypto-hunter/forward_observer.py
          python3 - <<'PY'
          import json,os,sys
          state='evidence/state.json'
          summary='evidence/summary.json'
          logs='evidence/observations.jsonl'
          if not all(os.path.isfile(p) and os.path.getsize(p)>0 for p in (state,summary,logs)):
              print('FAIL: missing state, summary or observations');sys.exit(1)
          with open(logs,encoding='utf-8') as f:rows=[json.loads(s) for s in f]
          samples=[r for r in rows if r.get('kind')=='sample' and r.get('pool_count',0)>0]
          pools=[r for r in rows if r.get('kind')=='pool']
          errors=[r for r in rows if r.get('kind')=='source_error']
          with open(summary,encoding='utf-8') as f:receipt=json.load(f)
          requested=int(os.getenv('CRYPTO_STUDY_CYCLES','3'))
          # Allow isolated endpoint failures, but require real 12-cycle coverage
          # rather than silently reporting that the longer scan ran.
          if len(samples)<max(2,requested-2):
              print('FAIL: extended collection coverage too low',{'sampled':len(samples),'requested':requested});sys.exit(1)
          if not samples or not pools or len(errors)>len(samples):
              print('FAIL: no usable live samples',{'samples':len(samples),'pools':len(pools),'errors':len(errors)});sys.exit(1)
          assert receipt.get('orders')==receipt.get('trades')==0
          with open('evidence/prospective_cohort_comparison.json',encoding='utf-8') as f:cohorts=json.load(f)
          assert cohorts['orders']==cohorts['trades']==0
          assert len(cohorts['groups'])==2
          with open('evidence/prospective_cohort_ledger.json',encoding='utf-8') as f:history=json.load(f)
          assert isinstance(history,list) and all(x['trades']==0 for x in history)
          with open('evidence/shadow_outcomes_ledger.json',encoding='utf-8') as f:shadow_history=json.load(f)
          assert isinstance(shadow_history,list) and all(x['orders']==x['trades']==0 and x['return_unrealized'] for x in shadow_history)
          with open(state,encoding='utf-8') as f:checkpoint=json.load(f)
          print('LIVE_STUDY_HEARTBEAT',json.dumps({'at':receipt['at'],'samples':len(samples),'pools':len(pools),'tracked':len(checkpoint),'signals':receipt.get('prospective_signals',0),'exits':receipt.get('paper_exits',0),'trades':0,'errors':len(errors)}))
          PY
      - name: Validate checkpoint including after collector failure
        if: always()
        id: state_integrity
        shell: bash
        run: |
          python3 - <<'PY'
          import json,pathlib,sys
          f=pathlib.Path('evidence/state.json')
          if not f.is_file():
              print('CHECKPOINT_INTEGRITY=NO_STATE')
              sys.exit(1)
          data=json.loads(f.read_text())
          assert isinstance(data,dict)
          for key,item in data.items():
              assert isinstance(key,str) and isinstance(item,dict)
              if item.get('entry'):
                  assert isinstance(item['entry'][0],str)
              if item.get('shadow'):
                  assert item['shadow'].get('no_capital_allocated') is True
          print('CHECKPOINT_INTEGRITY=PASS',json.dumps({'tracked':len(data),'paper_trades_executed':0}))
          PY
          echo "usable=true" >> "$GITHUB_OUTPUT"
      - name: Save durable state between future runs (also after receipt failure)
        if: always() && steps.state_integrity.outputs.usable == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            evidence/state.json
            evidence/prospective_cohort_ledger.json
            evidence/shadow_outcomes_ledger.json
          key: crypto-prospective-state-${{ github.run_id }}
      - name: Preserve independent evidence and receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-prospective-evidence-${{ github.run_id }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
      - name: Maintain research loop without relying on GitHub cron
        if: success() && ((github.event_name == 'workflow_dispatch' && inputs.chain) || github.event_name == 'schedule' || github.event_name == 'push')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # Mostly continuous research: 12 live samples per run,
          # followed by 15s handoff; bounded by a 30-minute job.
          # Runs remain research-only. No private keys, orders, or signatures.
          sleep 15
          # A stale older run can be reported as in_progress after it has
          # already finished, which previously killed the chain forever.
          # A newer dispatch is a valid successor; an older one is not.
          active=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/crypto-hunter-prospective-study.yml/runs?event=workflow_dispatch&per_page=20" --jq '.workflow_runs[] | "\(.id) \(.status)"' | awk -v own="${GITHUB_RUN_ID}" '$1>own && ($2=="in_progress" || $2=="queued" || $2=="pending"){print; exit}')
          if [ -n "$active" ]; then
            echo "CHANGED_RUNNING_WORKFLOW_DETECTED=$active"
            echo "Skipping duplicate chain dispatch"
            exit 0
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/crypto-hunter-prospective-study.yml/dispatches" -f ref=main -f 'inputs[chain]=true'
          echo "CHAIN_NEXT_REQUEST_ACCEPTED=true"
      - name: Bounded recovery after failed study (zero trading)
        if: failure() && github.event_name == 'workflow_dispatch' && inputs.chain
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          url="repos/${GITHUB_REPOSITORY}/actions/workflows/crypto-hunter-prospective-study.yml/runs?event=workflow_dispatch&per_page=12"
          prior=$(gh api "$url" --jq '[.workflow_runs[] | select(.status=="completed")][0:4] | .[].conclusion')
          consecutive=1
          while IFS= read -r result; do
            case "$result" in
              success) break ;;
              failure|cancelled|timed_out|action_required) consecutive=$((consecutive+1)) ;;
              *) break ;;
            esac
          done <<< "$prior"
          echo "FAILURE_CHAIN_LENGTH_INCLUDING_CURRENT=$consecutive"
          if [ "$consecutive" -ge 3 ]; then
            echo "HALTED_AFTER_THREE_CONSECUTIVE_FAILURES"
            exit 0
          fi
          sleep 70
          active=$(gh api "$url" --jq '[.workflow_runs[] | select(.status=="in_progress" or .status=="queued" or .status=="pending")] | .[].id' | grep -v "^${GITHUB_RUN_ID}$" || true)
          if [ -n "$active" ]; then
            echo "RECOVERY_SKIPPED_ALREADY_RUNNING=$active"
            exit 0
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/crypto-hunter-prospective-study.yml/dispatches" -f ref=main -f 'inputs[chain]=true'
          echo "FAILED_RUN_RECOVERY_DISPATCH_ACCEPTED=true"

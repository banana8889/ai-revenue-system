name: Crypto Hunter Free Historical Onchain Sample
# Second measured pass: creator-sell x buyer-count exploratory subgroups
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/crypto-hunter-open-history.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  historical:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Download complete no-key Pump.fun historical sample, verify rows, run canonical historical engine
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -q 'duckdb==1.4.1'
          python3 -m py_compile crypto-hunter/forward_observer.py
          mkdir -p evidence/history
          BASE=https://huggingface.co/datasets/pumpdatafun/pump-fun-trades-sample/resolve/main
          curl -fLsS --retry 3 --retry-delay 3 --max-time 240 \
            -o evidence/history/events.parquet \
            "$BASE/events/pumpdata-2026-10-15-events.parquet"
          for id in 00000 00001 00002; do
            echo "HISTORICAL_FREE_DATA_DOWNLOAD_START_SHARD=$id"
            curl -fLsS --retry 3 --retry-delay 3 --max-time 720 \
              -o "evidence/history/trade-$id.parquet" \
              "$BASE/data/pumpdata-2026-10-15-$id-of-00003.parquet"
            ls -lh "evidence/history/trade-$id.parquet"
          done
          python3 - <<'PY'
          import duckdb,json,pathlib
          events=pathlib.Path('evidence/history/events.parquet')
          files=sorted(pathlib.Path('evidence/history').glob('trade-*.parquet'))
          db=duckdb.connect()
          event_count=db.execute(f"SELECT count(*) FROM '{events}'").fetchone()[0]
          shards=[db.execute(f"SELECT count(*) FROM '{p}'").fetchone()[0] for p in files]
          print("HISTORICAL_DATA_SOURCE_RECEIPT",
              json.dumps({"source":"pumpdatafun/pump-fun-trades-sample",
                          "day":"2026-10-15","license":"CC BY 4.0",
                          "original_event_rows":event_count,"trade_shard_rows":shards,
                          "total_trades_and_failures":sum(shards)}),flush=True)
          assert event_count==75466 and sum(shards)==42133673 and len(files)==3
          PY
          python3 -u crypto-hunter/forward_observer.py --historical-open-sample
      - name: Upload compact historical evidence (not 1.2 GB raw data)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crypto-historical-real-onchain-${{ github.run_id }}
          path: evidence/historical_onchain_oct15_study.json
          retention-days: 30
          if-no-files-found: warn

name: Crypto Hunter Suspect 49x Liquidity Audit
on:
  push:
    branches: [main]
    paths: [.github/workflows/crypto-hunter-suspect-49x-audit.yml]
permissions:
  contents: read
jobs:
  quote-only:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify 49x-chart pool depth and exact-size executable routes
        run: |
          mkdir -p evidence
          python3 - <<'PY'
          import json,urllib.parse,urllib.request,urllib.error,time,datetime
          pool='9tF67hwvhakaz521EqCxGyAXCgjaESb8RqSx8Bqea2nR'
          mint='7N6PRjBJeS36JbzAcShYMFVpe8Jd4o3EaEHSrXfdv92S'
          usdc='EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v'
          doc={'at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'pool':pool,'mint':mint,
               'observation_49x_not_a_fill':True,'signed':False,'orders':0,'trades':0}
          def request(url,data=None):
              try:
                  r=urllib.request.Request(url,data=data,headers={'Accept':'application/json','Content-Type':'application/json','User-Agent':'CryptoHunterForensicAudit/1.0'},method='POST' if data else 'GET')
                  with urllib.request.urlopen(r,timeout=15) as z:return z.status,json.load(z)
              except urllib.error.HTTPError as e:return e.code,{'error':e.read(350).decode('utf-8','replace')}
              except Exception as e:return None,{'error':str(e)[:200]}
          status,g=request('https://api.geckoterminal.com/api/v2/networks/solana/pools/'+pool)
          att=(g.get('data') or {}).get('attributes',{}) if isinstance(g.get('data'),dict) else {}
          doc['pool_reserve']={'http':status,'reserve_usd':att.get('reserve_in_usd'),
                               'price_usd':att.get('base_token_price_usd'),'pool_created_at':att.get('pool_created_at')}
          rpc={'jsonrpc':'2.0','id':1,'method':'getAccountInfo','params':[mint,{'encoding':'jsonParsed'}]}
          status,g=request('https://api.mainnet-beta.solana.com',json.dumps(rpc).encode())
          acc=(g.get('result') or {}).get('value') or {}
          info=((acc.get('data') or {}).get('parsed') or {}).get('info') or {}
          doc['mint_info']={'http':status,'decimals':info.get('decimals'),'mintAuthority':info.get('mintAuthority'),
                            'freezeAuthority':info.get('freezeAuthority'),'owner':acc.get('owner')}
          def dex(label,frm,to,amount):
              params=urllib.parse.urlencode({'inputMint':frm,'outputMint':to,'amount':amount})
              url='https://api.jup.ag/swap/v2/order?'+params
              sc,ret=request(url)
              out=ret.get('outAmount') if isinstance(ret,dict) else None
              val={'http':sc,'quote_available':bool(out),'in_raw':amount,'out_raw':out,
                   'router':ret.get('router') if isinstance(ret,dict) else None,'error':ret.get('error') if isinstance(ret,dict) else ''}
              doc[label]=val
              return int(out) if out else 0
          bought=dex('jupiter_buy_5usdc',usdc,mint,5000000)
          time.sleep(2.3)
          if bought:dex('jupiter_sell_immediate',mint,usdc,bought)
          else:
              dec=info.get('decimals',6)
              try:raw=int(5/1.74334632176891e-05*(10**int(dec)))
              except (TypeError,ValueError,OverflowError):raw=0
              if raw>0:dex('jupiter_sell_hypothetical_5usd_entry_raw',mint,usdc,raw)
          sc,r=request('https://transaction-v1.raydium.io/compute/swap-base-in?'+urllib.parse.urlencode({'inputMint':usdc,'outputMint':mint,'amount':5000000,'slippageBps':100,'txVersion':'V0'}))
          doc['raydium_buy_quote']={'http':sc,'success':r.get('success') if isinstance(r,dict) else None,
                                   'error':r.get('msg') if isinstance(r,dict) else None,
                                   'outputAmount':((r.get('data') or {}).get('outputAmount')) if isinstance(r,dict) else None}
          print('49X_FORENSIC_QUOTE_AUDIT',json.dumps(doc,ensure_ascii=False))
          with open('evidence/chart_49x_liquidity_route_audit.json','w') as f:json.dump(doc,f,indent=2)
          PY
      - name: Preserve forensic observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 49x-no-trade-liquidity-forensics
          path: evidence
          if-no-files-found: warn

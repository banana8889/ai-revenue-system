name: Crypto Hunter PumpSwap Onchain Vault Proof
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/crypto-hunter-pumpswap-onchain-proof.yml
      - crypto-hunter/forward_observer.py
permissions:
  contents: read
jobs:
  verify-onchain:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile and install WebSocket support
        run: |
          python3 -m py_compile crypto-hunter/forward_observer.py
          python3 -m pip install -q --disable-pip-version-check 'websockets==13.1'
      - name: Verify published PumpSwap pool and exact two vault balances on mainnet
        run: python3 -u crypto-hunter/forward_observer.py --pumpswap-live-proof
      - name: Verify direct Solana WebSocket account subscriptions for both pool vaults
        run: python3 -u crypto-hunter/forward_observer.py --pumpswap-ws-live-proof
      - name: Verify mainnet pool LP mint supply, creator LP holdings and largest LP account
        run: python3 -u crypto-hunter/forward_observer.py --pumpswap-lp-live-proof

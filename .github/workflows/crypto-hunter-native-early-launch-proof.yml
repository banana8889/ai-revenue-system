name: Crypto Hunter Genuine Pump.fun First-Seconds Feed
on:
  push:
    branches: [main]
    paths:
      - crypto-hunter/forward_observer.py
      - .github/workflows/crypto-hunter-native-early-launch-proof.yml
  pull_request:
    paths:
      - crypto-hunter/forward_observer.py
      - .github/workflows/crypto-hunter-native-early-launch-proof.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mainnet:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Compile canonical single-file scanner
        run: python3 -m py_compile crypto-hunter/forward_observer.py
      - name: Observe actual Pump.fun confirmed launch transactions on Solana mainnet
        run: |
          python3 -m pip install -q 'websockets==13.1'
          python3 -u crypto-hunter/forward_observer.py --pumpfun-early-proof
      - name: Verify same-mint source linkage of native-first30 route requests
        run: |
          python3 - <<'PY'
          import json,pathlib,hashlib
          root=pathlib.Path('evidence')
          def read(name):
              path=root/name
              return [json.loads(line) for line in path.read_text(
                  encoding='utf-8').splitlines()] if path.is_file() else []
          early={row['mint']:row for row in read('pumpfun_30s_features.jsonl')
                 if row.get('full_first_30s_observation') is True}
          rows=read('pumpfun_native_first30_route_quotes.jsonl')
          selected={row['mint']:row for row in rows
                    if row.get('kind')=='native_first30_quote_selection'}
          baselines=[row for row in rows
                     if row.get('kind')=='native_first30_quote_baseline']
          later=[row for row in rows
                 if row.get('kind')=='native_first30_five_minute_sell_quote']
          assert all(row['mint'] in early and
                     row['completed_first30_at']==early[row['mint']]['completion_at']
                     and row.get('selected_before_future_prices') is True
                     for row in selected.values())
          assert all(row['mint'] in selected for row in baselines)
          assert all(row['mint'] in selected for row in later)
          for mint,selection in selected.items():
              if selection.get('fixed_horizon_protocol')!='20261029_fixed60_120_v2':
                  continue
              expected=60 if hashlib.sha256(mint.encode('ascii')).digest()[0]%2==0 else 120
              assert selection.get('fixed_horizon_s')==expected, mint
              assert selection.get('selected_before_future_prices') is True
          for base in baselines:
              if base.get('fixed_horizon_protocol')!='20261029_fixed60_120_v2':
                  continue
              mint=base['mint']
              assert selected[mint].get('fixed_horizon_protocol')==base['fixed_horizon_protocol']
              assert base['fixed_horizon_s']==selected[mint]['fixed_horizon_s']
              age=base.get('buy_quote_response_seconds_after_launch')
              assert isinstance(age,(int,float))
              valid=base.get('first30_buy_quote_early_valid') is True
              assert valid == (base.get('buy_route_available') is True
                  and isinstance(base.get('token_raw'),int)
                  and base['token_raw']>0 and 30<=age<60)
              assert (base.get('late_or_unavailable_first30_entry_censored')
                      is True)==(not valid)
          fixed=[row for row in rows
                 if row.get('kind')=='native_first30_fixed_horizon_sell_quote']
          baseline_mints={row['mint'] for row in baselines}
          for row in fixed:
              mint=row['mint']
              expected=60 if hashlib.sha256(mint.encode('ascii')).digest()[0]%2==0 else 120
              assert mint in selected and mint in baseline_mints
              assert row['fixed_horizon_s']==expected
              assert (row.get('within_30s_of_assigned_deadline') is True)==(
                  expected<=row['elapsed_at_response_s']<=expected+30)
              assert not row.get('timely_sell_route_available') or (
                  row.get('sell_route_available') is True and
                  row.get('within_30s_of_assigned_deadline') is True)
          assert all(
              any(base['mint']==row['mint'] and
                  base.get('first30_buy_quote_early_valid') is True
                  for base in baselines)
              for row in fixed)
          assert all(row.get('orders')==row.get('trades')==0
                     and row.get('no_fill') is True for row in rows)
          print('NATIVE_FIRST30_ROUTE_PROOF',json.dumps({
              'frozen_first30_feature_mints':len(early),
              'prospectively_selected_mints':len(selected),
              'read_only_quote_baselines':len(baselines),
              'five_minute_sell_quotes_recorded':len(later),
              'independent_60_or_120s_horizon_quotes_recorded':len(fixed),
              'horizon_hash_assignment_and_timing_verified':True,
              'fixed_horizon_protocol':'20261029_fixed60_120_v2',
              'early_buy_quote_response_and_protocol_validated':True,
              'eligible_early_quote_baselines':sum(
                  row.get('first30_buy_quote_early_valid') is True
                  and row.get('fixed_horizon_protocol')=='20261029_fixed60_120_v2'
                  for row in baselines),
              'missing_quote_is_not_a_filled_loss':True,
              'real_orders':0,'real_trades':0}))
          PY
      - name: Persist original readonly first-seconds and route evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pumpfun-live-create-proof-${{ github.run_id }}
          path: |
            evidence/pumpfun_first_seconds_live.jsonl
            evidence/pumpfun_30s_features.jsonl
            evidence/pumpfun_native_first30_route_quotes.jsonl
          if-no-files-found: warn
          retention-days: 14
